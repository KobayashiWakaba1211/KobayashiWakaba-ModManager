[package]
name = "endfield-mod-manager"
version = "0.3.0"
description = "小林若葉Manager - 面向多游戏 XXMI 生态的 Mod 管理器（QAQM 的 Rust 复刻版）"
authors = ["小林若葉 (KobayashiWakaba1211)"]
license = "GPL-3.0-only"
repository = "https://github.com/KobayashiWakaba1211/KobayashiWakaba-ModManager"
readme = "../README.md"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "endfield_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 由 `tauri build` / `cargo build --release --features custom-protocol` 启用：
# 启用后前端走打包内嵌资源（frontendDist），否则连接 devUrl（localhost:1420）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "util"] }
# RAR 解压：内置 UnRAR 源码静态编译，运行时不依赖系统任何 7-Zip / Bandizip（仅解压，未实现压缩）
unrar = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "json"] }
tokio = { version = "1", features = ["time"] }
sha1 = "0.10"
pinyin = "0.10"
trash = "5"
tempfile = "3"

# 仅用于检测进程是否以管理员权限运行（提权后 Windows 会阻止外部文件拖入）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }


# 增量编译在本机（H: 盘 + 大 PDB）会偶发链接阶段卡死（rustc 停在 442/442 不动）。
# 关闭后每次改 Rust 约 30~40s 重编译，但稳定可靠。
[profile.dev]
incremental = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# thin LTO：跨 crate 优化基本到位，构建时间与内存远低于 fat LTO，
# 也不会在链接阶段卡死（fat LTO 在本项目上曾多次卡住不动）
lto = "thin"
codegen-units = 16
opt-level = 3
panic = "abort"
strip = true

[package]
name = "endfield-mod-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "endfield_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "util"] }
# RAR 解压：内置 UnRAR 源码静态编译，运行时不依赖系统任何 7-Zip / Bandizip（仅解压，未实现压缩）
unrar = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
tokio = { version = "1", features = ["time"] }
sha1 = "0.10"
pinyin = "0.10"
trash = "5"

# 仅用于检测进程是否以管理员权限运行（提权后 Windows 会阻止外部文件拖入）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }


# 增量编译在本机（H: 盘 + 大 PDB）会偶发链接阶段卡死（rustc 停在 442/442 不动）。
# 关闭后每次改 Rust 约 30~40s 重编译，但稳定可靠。
[profile.dev]
incremental = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
